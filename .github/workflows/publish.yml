name: Publish Package

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
      - master

jobs:
  publish:
    name: Publish to Atlassian npm-public (Artifactory forwarder)
    runs-on: ubuntu-latest
    env:
      NEW_VERSION: "1.0.${{ github.run_number }}"

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (CI)
        run: npm ci

      - name: Build
        run: npm run build

      - name: Set version from run number
        run: |
          echo "Setting package version to ${NEW_VERSION}"
          npm version --no-git-tag-version "${NEW_VERSION}"

      - name: Verify publishConfig
        run: |
          node -e "const p=require('./package.json'); if(!p.publishConfig||!p.publishConfig.registry||!p.publishConfig.registry.includes('packages.atlassian.com')){process.exit(1)}; console.log('publishConfig OK ->', p.publishConfig.registry)"

      - name: Get Artifact Publish Token
        id: publish-token
        uses: atlassian-labs/artifact-publish-token@v1.0.1
        with:
          output-modes: npm

      - name: Publish to npm
        run: npm publish --userconfig=./.npmrc-public --@atlassian/danger-plugin-atlassian:registry="https://packages.atlassian.com/api/npm/npm-public/"
